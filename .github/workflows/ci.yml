name: Talusan System CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          test -f index.html
          grep -q '<html' index.html

      - name: Show success
        run: echo "Basic checks passed!"
